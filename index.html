<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <title>🎸 Moje gitarové skladby</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/alphaTab.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f8f8;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 20px;
    }
    select {
      font-size: 16px;
      padding: 6px 10px;
      margin-bottom: 15px;
    }

    .at-wrap {
      width: 90vw;
      height: 80vh;
      margin: 0 auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .at-viewport {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
    }

    /* HUD (ovládanie) */
    .at-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2f4f80;
      color: #fff;
      padding: 5px 10px;
    }

    .at-controls .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      margin: 0 5px;
    }

    .at-controls select {
      background: #2f4f80;
      color: #fff;
      border: 1px solid #4f6f9f;
      border-radius: 5px;
      padding: 3px 5px;
    }

    .at-player-progress {
      font-size: 12px;
      margin: 0 8px;
    }

    .at-cursor-beat {
      background: rgba(0, 120, 255, 0.75);
      width: 3px;
    }

    .at-cursor-bar {
      background: rgba(255, 255, 0, 0.25);
    }

    .at-highlight * {
      fill: #0078ff;
      stroke: #0078ff;
    }
  </style>
</head>
<body>
  <h1><i class="fa-solid fa-guitar"></i> Moje gitarové skladby</h1>

  <label for="songSelect">Vyber skladbu:</label>
  <select id="songSelect">
    <option value="Etude VI.gp">Etuda VI</option>
    <option value="oteckovia.gp5">Oteckovia</option>
    <option value="Tears-In-Heaven.gp3">Tears In Heaven</option>
   </select>

  <div id="playerContainer"></div>

  <script>
    const songSelect = document.getElementById("songSelect");
    const playerContainer = document.getElementById("playerContainer");
    let api = null;

    function loadSong(fileName) {
      playerContainer.innerHTML = `
        <div class="at-wrap">
          <div class="at-viewport">
            <div class="at-main"></div>
          </div>
          <div class="at-controls">
            <div class="controls-left">
              <button class="btn at-stop"><i class="fas fa-step-backward"></i></button>
              <button class="btn at-play"><i class="fas fa-play"></i></button>
              <span class="at-player-progress">Načítavam...</span>
            </div>
            <div class="controls-right">
              <button class="btn at-count"><i class="fas fa-hourglass-half"></i></button>
              <button class="btn at-metronome"><i class="fas fa-drum"></i></button>
              <button class="btn at-loop"><i class="fas fa-retweet"></i></button>
              <button class="btn at-print"><i class="fas fa-print"></i></button>
              <select class="zoom">
                <option value="75">75%</option>
                <option value="100" selected>100%</option>
                <option value="125">125%</option>
                <option value="150">150%</option>
              </select>
              <select class="layout">
                <option value="horizontal">Horizontal</option>
                <option value="page" selected>Page</option>
              </select>
            </div>
          </div>
        </div>
      `;

      const wrapper = playerContainer.querySelector(".at-wrap");
      const main = wrapper.querySelector(".at-main");
      const settings = {
        file: fileName,
        player: {
          enablePlayer: true,
          soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/soundfont/sonivox.sf2",
          scrollElement: wrapper.querySelector('.at-viewport')
        }
      };

      api = new alphaTab.AlphaTabApi(main, settings);

      const playBtn = wrapper.querySelector(".at-play");
      const stopBtn = wrapper.querySelector(".at-stop");
      const prog = wrapper.querySelector(".at-player-progress");
      const metronome = wrapper.querySelector(".at-metronome");
      const loop = wrapper.querySelector(".at-loop");
      const zoom = wrapper.querySelector(".zoom");
      const layout = wrapper.querySelector(".layout");

      // Zvýraznenie počas prehrávania
      api.cursorChanged.on((cursor) => {
        if (cursor.beat) cursor.beat.element.scrollIntoView({ block: "center" });
      });

      api.playerReady.on(() => {
        prog.innerText = "Pripravené";
      });

      playBtn.onclick = () => api.playPause();
      stopBtn.onclick = () => api.stop();

      api.playerStateChanged.on((e) => {
        const icon = playBtn.querySelector("i");
        if (e.state === alphaTab.synth.PlayerState.Playing) {
          icon.classList.replace("fa-play", "fa-pause");
        } else {
          icon.classList.replace("fa-pause", "fa-play");
        }
      });

      api.soundFontLoad.on((e) => {
        const percent = Math.floor((e.loaded / e.total) * 100);
        prog.innerText = `Načítavam zvuky: ${percent}%`;
      });

      // Metronóm
      metronome.onclick = () => {
        metronome.classList.toggle("active");
        api.metronomeVolume = metronome.classList.contains("active") ? 1 : 0;
      };

      // Loop
      loop.onclick = () => {
        loop.classList.toggle("active");
        api.isLooping = loop.classList.contains("active");
      };

      // Zoom
      zoom.onchange = () => {
        api.settings.display.scale = parseInt(zoom.value) / 100;
        api.updateSettings();
        api.render();
      };

      // Layout
      layout.onchange = () => {
        api.settings.display.layoutMode = layout.value === "horizontal"
          ? alphaTab.LayoutMode.Horizontal
          : alphaTab.LayoutMode.Page;
        api.updateSettings();
        api.render();
      };
    }

    songSelect.addEventListener("change", () => loadSong(songSelect.value));
    loadSong(songSelect.value);
  </script>
</body>
</html>
