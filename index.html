<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>🎸 AlphaTab Gitarový prehrávač</title>

  <!-- Staršia, nemodulová verzia AlphaTab -->
  <script src="https://cdn.jsdelivr.net/npm/alphatab@1.4.3/dist/alphaTab.min.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; background: #f8f8f8; }
    h1 { text-align: center; }
    #alphaTab { height: 600px; border: 1px solid #ccc; background: white; overflow: auto; }
  </style>
</head>
<body>
  <h1>🎸 Moje gitarové skladby</h1>
  <div id="alphaTab"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.querySelector("#alphaTab");

      // ✅ Toto je správne API pre verziu 1.4.3
      const api = new alphaTab.AlphaTabApi(el, {
      file: "oteckovia.gp5" // nahraj tento súbor do rovnakého priečinka
      });

      // Voliteľné – reakcie na udalosti
      api.renderStarted.on(() => console.log("🎶 Začína sa renderovanie nôt..."));
      api.renderFinished.on(() => console.log("✅ Noty boli zobrazené."));
    });
  </script>
</body>
</html>
