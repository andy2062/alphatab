<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>🎸 AlphaTab Gitarový prehrávač</title>
  <!-- Nová AlphaTab knižnica -->
  <script src="https://cdn.jsdelivr.net/npm/alphatab@latest/dist/alphaTab.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f8f8f8; }
    h1 { text-align: center; }
    #alphaTab { height: 600px; border: 1px solid #ccc; background: white; overflow: auto; }
  </style>
</head>
<body>
  <h1>🎸 Moje gitarové skladby</h1>
  <div id="alphaTab"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.querySelector("#alphaTab");
      
      // 🔧 overíme, čo je v window (niektoré buildy menia názvy)
      const AlphaTabClass = window.alphaTab?.AlphaTabApi 
        || window.AlphaTabApi 
        || window.AlphaTab 
        || window.alphaTab;

      if (!AlphaTabClass) {
        console.error("AlphaTab API sa nenačítalo – skontroluj CDN link.");
        return;
      }

      // 🔹 inicializácia prehrávača
      const api = new AlphaTabClass(el, {
        file: "oteckovia.gp5" // nahraj tento súbor do rovnakého priečinka
      });
    });
  </script>
</body>
</html>
