<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>🎸 Moje gitarové skladby</title>
  <script src="https://cdn.jsdelivr.net/npm/alphatab@latest/dist/alphaTab.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #f8f8f8; margin: 0; padding: 2em; }
    h1 { text-align: center; }
    .menu a { display: inline-block; margin: 8px; padding: 10px 15px; background: #eee; border-radius: 8px; text-decoration: none; color: #333; }
    .menu a:hover { background: #ddd; }
    #alphaTab { margin-top: 20px; height: 600px; border: 1px solid #ccc; background: white; overflow: auto; }
  </style>
</head>
<body>
  <h1>🎸 Moje gitarové skladby</h1>

  <div class="menu">
    <a href="index.html">Úvodná skladba</a>
    <a href="piesen1.html">Pieseň 1</a>
    <a href="piesen2.html">Pieseň 2</a>
  </div>

  <div id="alphaTab"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.querySelector("#alphaTab");
      new alphaTab.AlphaTab(el, {
        file: "moja-piesen.gp5" // nahraj tento súbor do rovnakého priečinka
      });
    });
  </script>
</body>
</html>
