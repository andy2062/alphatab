<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>🎸 Gitarové skladby – AlphaTab prehrávač</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      background: #f8f8f8;
    }
    h1 {
      text-align: center;
      margin-top: 10px;
    }
    .song-select {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
    select {
      font-size: 14px;
      padding: 5px 10px;
    }
    .at-wrap {
      width: 90vw;
      height: 80vh;
      margin: 0 auto;
      border: 1px solid rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: white;
    }
    .at-content {
      position: relative;
      overflow: hidden;
      flex: 1 1 auto;
    }
    .at-viewport {
      overflow-y: auto;
      position: absolute;
      top: 0;
      left: 70px;
      right: 0;
      bottom: 0;
      padding-right: 20px;
    }
    .at-controls {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      background: #436d9d;
      color: #fff;
    }
    .at-controls > div {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .at-controls .btn {
      color: #fff;
      border-radius: 0;
      width: 40px;
      height: 40px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .at-controls .btn.disabled {
      cursor: progress;
      opacity: 0.5;
    }
    .at-player-progress { margin-left: 10px; }
    .at-song-position { margin-left: 10px; }
  </style>
</head>
<body>
  <h1><i class="fa-solid fa-guitar"></i> Moje gitarové skladby</h1>

  <label for="songSelect">Vyber skladbu:</label>
  <select id="songSelect">
   <option value="Tears-In-Heaven.gp3">Tears In Heaven</option>
      <option value="Etude VI.gp">Etuda VI</option>
      <option value="oteckovia.gp5">Oteckovia</option>
  </select>

  <div id="alphaTab"></div>

  <script>
    window.onload = function() {
      const container = document.getElementById("alphaTab");
      const select = document.getElementById("songSelect");

      function loadSong(fileName) {
        container.innerHTML = ""; // vyčisti starý obsah
        new alphaTab.AlphaTabApi(container, {
          file: fileName,
          player: {
            enablePlayer: true,
            soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/soundfont/sonivox.sf2"
          }
        });
      }

      select.addEventListener("change", () => loadSong(select.value));
      loadSong(select.value); // načíta prvú skladbu hneď po spustení
    };
  </script>
</body>
</html>
