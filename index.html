<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>🎸 AlphaTab Gitarový prehrávač</title>
  <!-- Načítaj aktuálnu knižnicu AlphaTab -->
  <script src="https://cdn.jsdelivr.net/npm/alphatab@latest/dist/alphaTab.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f8f8f8; }
    h1 { text-align: center; }
    #alphaTab { height: 600px; border: 1px solid #ccc; background: white; overflow: auto; }
  </style>
</head>
<body>
  <h1>🎸 Moje gitarové skladby</h1>
  <div id="alphaTab"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const el = document.querySelector("#alphaTab");
      
      try {
        // ✅ Nový spôsob inicializácie AlphaTab
        await alphaTab.render(el, {
          file: "oteckovia.gp5" // nahraj tento súbor do rovnakého priečinka
        });
        console.log("✅ AlphaTab načítaný úspešne");
      } catch (err) {
        console.error("❌ Chyba pri načítaní AlphaTab:", err);
      }
    });
  </script>
</body>
</html>
