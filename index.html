<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>🎸 Gitarové skladby – AlphaTab prehrávač</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      background: #f8f8f8;
    }
    h1 {
      text-align: center;
      margin-top: 10px;
    }
    .song-select {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
    select {
      font-size: 14px;
      padding: 5px 10px;
    }
    .at-wrap {
      width: 90vw;
      height: 80vh;
      margin: 0 auto;
      border: 1px solid rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: white;
    }
    .at-content {
      position: relative;
      overflow: hidden;
      flex: 1 1 auto;
    }
    .at-viewport {
      overflow-y: auto;
      position: absolute;
      top: 0;
      left: 70px;
      right: 0;
      bottom: 0;
      padding-right: 20px;
    }
    .at-controls {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      background: #436d9d;
      color: #fff;
    }
    .at-controls > div {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .at-controls .btn {
      color: #fff;
      border-radius: 0;
      width: 40px;
      height: 40px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .at-controls .btn.disabled {
      cursor: progress;
      opacity: 0.5;
    }
    .at-player-progress { margin-left: 10px; }
    .at-song-position { margin-left: 10px; }
  </style>
</head>
<body>
  <h1>🎶 Moje gitarové skladby</h1>
  
  <!-- Výber skladby -->
  <div class="song-select">
    <label for="songSelect">Vyber skladbu: </label>
    <select id="songSelect">
      <option value="Tears-In-Heaven.gp3">Tears In Heaven</option>
      <option value="Etude VI.gp">Etuda VI</option>
      <option value="oteckovia.gp5">Oteckovia</option>
    </select>
  </div>

  <!-- Hlavný prehrávač -->
  <div class="at-wrap">
    <div class="at-content">
      <div class="at-sidebar">
        <div class="at-sidebar-content">
          <div class="at-track-list"></div>
        </div>
      </div>
      <div class="at-viewport">
        <div class="at-main"></div>
      </div>
    </div>

    <!-- Ovládanie -->
    <div class="at-controls">
      <div>
        <a class="btn at-player-stop disabled"><i class="fas fa-step-backward"></i></a>
        <a class="btn at-player-play-pause disabled"><i class="fas fa-play"></i></a>
        <span class="at-player-progress">0%</span>
        <span class="at-song-position">00:00 / 00:00</span>
      </div>
      <div>
        <a class="btn at-metronome"><i class="fas fa-edit"></i></a>
        <a class="btn at-loop"><i class="fas fa-retweet"></i></a>
        <a class="btn at-print"><i class="fas fa-print"></i></a>
      </div>
    </div>
  </div>

  <script>
    const wrapper = document.querySelector(".at-wrap");
    const main = wrapper.querySelector(".at-main");
    const select = document.getElementById("songSelect");

    // Inicializácia AlphaTab API
    const api = new alphaTab.AlphaTabApi(main, {
      file: select.value,
      player: {
        enablePlayer: true,
        soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2",
        scrollElement: wrapper.querySelector('.at-viewport')
      }
    });

    // Zmena skladby po výbere
    select.addEventListener("change", () => {
      api.loadScore(select.value);
    });

    // Ovládacie prvky
    const playPause = wrapper.querySelector(".at-player-play-pause");
    const stop = wrapper.querySelector(".at-player-stop");
    const loop = wrapper.querySelector(".at-loop");
    const metronome = wrapper.querySelector(".at-metronome");
    const printBtn = wrapper.querySelector(".at-print");
    const progress = wrapper.querySelector(".at-player-progress");
    const position = wrapper.querySelector(".at-song-position");

    playPause.onclick = () => api.playPause();
    stop.onclick = () => api.stop();
    loop.onclick = () => {
      loop.classList.toggle("active");
      api.isLooping = loop.classList.contains("active");
    };
    metronome.onclick = () => {
      metronome.classList.toggle("active");
      api.metronomeVolume = metronome.classList.contains("active") ? 1 : 0;
    };
    printBtn.onclick = () => api.print();

    api.soundFontLoad.on(e => {
      const percent = Math.floor((e.loaded / e.total) * 100);
      progress.innerText = percent + "%";
    });
    api.playerReady.on(() => {
      playPause.classList.remove("disabled");
      stop.classList.remove("disabled");
      progress.style.display = "none";
    });

    api.playerPositionChanged.on(e => {
      const minutes = (e.currentTime / 60000) | 0;
      const seconds = ((e.currentTime % 60000) / 1000) | 0;
      const endMinutes = (e.endTime / 60000) | 0;
      const endSeconds = ((e.endTime % 60000) / 1000) | 0;
      position.innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} / ${String(endMinutes).padStart(2, '0')}:${String(endSeconds).padStart(2, '0')}`;
    });
  </script>
</body>
</html>
