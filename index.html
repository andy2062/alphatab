<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Moje gitarové skladby</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f9fa;
      color: #222;
    }

    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }

    .menu {
      margin: 1rem auto;
      text-align: center;
    }

    select {
      font-size: 1rem;
      padding: 0.5rem;
      border-radius: 8px;
    }

    iframe {
      display: block;
      margin: 1rem auto;
      width: 90vw;
      height: 80vh;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    footer {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>🎸 Moje gitarové skladby</header>

  <div class="menu">
    <label for="songSelect">Vyber skladbu: </label>
    <select id="songSelect">
      <option value="">-- vyber --</option>
      <option value="etuda6.html">Etuda VI – L. Brouwer</option>
      <option value="tears-in-heaven.html">Tears in Heaven – Eric Clapton</option>
      <option value="oteckovia.html">Oteckovia (film)</option>
    </select>
  </div>

  <iframe id="playerFrame" src="" title="Prehrávač"></iframe>

  <footer>
    &copy; 2025 Moje gitarové skladby – vytvorené pomocou AlphaTab 🎶
  </footer>

  <script>
    const select = document.getElementById('songSelect');
    const frame = document.getElementById('playerFrame');

    select.addEventListener('change', () => {
      const file = select.value;
      if (file) {
        frame.src = file;
      } else {
        frame.src = '';
      }
    });
  </script>
</body>
</html>
