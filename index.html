      <!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Moje gitarové skladby</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/alphaTab.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fafafa;
      margin: 40px;
    }
    h1 {
      color: #333;
    }
    #alphaTab {
      width: 90%;
      height: 70vh;
      margin: 20px auto;
      border: 1px solid #ccc;
      background: white;
    }
    select {
      font-size: 16px;
      padding: 6px 10px;
      margin-left: 10px;
    }
    .at-controls {
      margin: 10px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn {
      cursor: pointer;
      font-size: 20px;
      color: #333;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      transition: 0.2s;
    }
    .btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1><i class="fa-solid fa-guitar"></i> Moje gitarové skladby</h1>

  <label for="songSelect">Vyber skladbu:</label>
  <select id="songSelect">
    <option value="Tears-In-Heaven.gp3">Tears In Heaven</option>
      <option value="Etude VI.gp">Etuda VI</option>
      <option value="oteckovia.gp5">Oteckovia</option>
  </select>

  <div id="alphaTab"></div>

  <div class="at-controls">
    <span class="btn" id="playPause"><i class="fa-solid fa-play"></i></span>
    <span class="btn" id="stop"><i class="fa-solid fa-stop"></i></span>
    <span id="position">00:00 / 00:00</span>
  </div>

  <script>
    window.onload = function() {
      const container = document.getElementById("alphaTab");
      const select = document.getElementById("songSelect");
      const playPause = document.getElementById("playPause");
      const stop = document.getElementById("stop");
      const position = document.getElementById("position");
      let api = null;

      function formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const min = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const sec = String(totalSec % 60).padStart(2, "0");
        return `${min}:${sec}`;
      }

      function loadSong(fileName) {
        if (api) {
          api.destroy();
          container.innerHTML = "";
        }

        api = new alphaTab.AlphaTabApi(container, {
          file: fileName,
          player: {
            enablePlayer: true,
            soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/soundfont/sonivox.sf2"
          }
        });

        // Keď je prehrávač pripravený
        api.playerReady.on(() => {
          playPause.classList.remove("disabled");
          stop.classList.remove("disabled");
        });

        // Tlačidlá
        playPause.onclick = () => {
          api.playPause();
        };
        stop.onclick = () => {
          api.stop();
        };

        // Aktualizácia tlačidla podľa stavu
        api.playerStateChanged.on((e) => {
          const icon = playPause.querySelector("i");
          if (e.state === alphaTab.synth.PlayerState.Playing) {
            icon.classList.replace("fa-play", "fa-pause");
          } else {
            icon.classList.replace("fa-pause", "fa-play");
          }
        });

        // Pozícia skladby
        api.playerPositionChanged.on((e) => {
          position.innerText = `${formatTime(e.currentTime)} / ${formatTime(e.endTime)}`;
        });
      }

      select.addEventListener("change", () => loadSong(select.value));
      loadSong(select.value);
    };
  </script>
</body>
</html>
